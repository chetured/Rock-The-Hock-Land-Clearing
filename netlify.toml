[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send the bare domain to www so there is one canonical address.
[[redirects]]
  from = "https://rthllc.com/*"
  to = "https://www.rthllc.com/:splat"
  status = 301
  force = true

# Rental pages are hidden for now; send old links to the equipment section.
[[redirects]]
  from = "/skid-steer-rental/*"
  to = "/#equipment"
  status = 301
[[redirects]]
  from = "/forestry-mulcher-rental/*"
  to = "/#equipment"
  status = 301
[[redirects]]
  from = "/skid-steer-attachment-rental/*"
  to = "/#equipment"
  status = 301
[[redirects]]
  from = "/golf-cart-rental/*"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
